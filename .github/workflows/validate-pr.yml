name: ORI contribution checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
jobs:
  tests:
    name: platform-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run all platform regression tests
        run: python3 -m unittest discover -s .github/ori/tests -p 'test_*.py' -v
# This read-only job is NOT the authorization gate. A trusted default-branch
# workflow independently checks PR trees via the API and reports ori-validation.
