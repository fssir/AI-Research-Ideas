name: ORI contribution checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
jobs:
  tests:
    name: platform-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run all platform regression tests
        run: python3 -m unittest discover -s .github/ori/tests -p 'test_*.py' -v
      - name: Export public source for this audit only
        if: always() && github.head_ref == 'platform/followup-audit' && github.event.pull_request.user.id == 59813921
        run: git archive --format=zip HEAD -o /tmp/ori-source.zip
      - name: Save audit snapshot
        if: always() && github.head_ref == 'platform/followup-audit' && github.event.pull_request.user.id == 59813921
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ori-audit-source
          path: /tmp/ori-source.zip
          retention-days: 3
# The source-export steps are temporary and will be removed before merge.
# This read-only job is not the authorization gate.
