name: Allocate Ideas and rebuild index

on:
  push:
    branches: ["main"]
    paths:
      - "submissions/**"
      - "ideas/**"
      - "registry/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ori-platform-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Allocate all pending submissions
        run: python scripts/allocate_idea.py --all

      - name: Rebuild Idea index
        run: python scripts/build_index.py

      - name: Check whether platform files changed
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create platform maintenance Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="automation/ori-maintenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: allocate Ideas and rebuild index"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: allocate pending Ideas and rebuild index" \
            --body "Automated platform maintenance: assigns permanent Idea numbers/GMT+3 timestamps, records ownership, and refreshes the Idea index.")
          gh pr merge --auto --squash "$PR_URL"
