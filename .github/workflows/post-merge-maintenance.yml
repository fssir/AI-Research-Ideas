name: ORI index maintenance

on:
  push:
    branches: ["main"]
    paths:
      - "ideas/**"
      - "registry/**"

permissions:
  contents: write

jobs:
  maintain:
    if: ${{ !contains(github.event.head_commit.message, '[skip ori-maintenance]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_index.py
      - name: Commit generated index/registry changes
        run: |
          git config user.name "ori-platform-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ideas/README.md registry/ideas.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: rebuild ORI index [skip ori-maintenance]"
          git push
