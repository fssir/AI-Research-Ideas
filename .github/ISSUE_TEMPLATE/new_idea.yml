name: Submit a new Idea
description: Share an original idea; one Markdown page is enough.
title: "[NEW IDEA] "
body:
  - type: markdown
    attributes:
      value: |
        Describe your idea in any language. Code, data, figures and papers are optional.
        Original contributions use CC0-1.0: reuse, modification and commercial use without required attribution.
        Submit only material you can release. Do not upload third-party papers, secrets or confidential data without permission.
  - type: input
    id: idea_title
    attributes:
      label: Idea title
    validations:
      required: true
  - type: textarea
    id: idea_description
    attributes:
      label: Idea description
      description: The key question and idea; no mandatory metadata form.
    validations:
      required: true
  - type: textarea
    id: ai_prompt
    attributes:
      label: Optional prompt for AI
    validations:
      required: false
  - type: checkboxes
    id: declaration
    attributes:
      label: Declaration
      options:
        - label: I dedicate my original contribution under CC0-1.0 and have the right to submit it.
          required: true
        - label: I genuinely believe the core idea is original and have not knowingly copied an existing academic work.
          required: true
