name: Discuss a research idea
description: Optional discussion before submitting an Idea folder
title: "[IDEA] "
body:
  - type: markdown
    attributes:
      value: |
        This issue form is optional. To add an Idea to the official library, submit at least one Markdown file through a Pull Request under submissions/<your-github-username>/<short-name>/.
  - type: input
    id: idea_title
    attributes:
      label: Idea title
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea description
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Optional prompt for AI
    validations:
      required: false
