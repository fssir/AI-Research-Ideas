schema_version: 1

id: null
title: "<Research Idea Title>"
summary: "<One- or two-sentence searchable summary>"
abstract: "<Short abstract>"

owner:
  github: "<your-github-username>"
  display_name: "<optional display name>"

fields:
  - "<primary research field>"

keywords:
  - "<keyword-1>"
  - "<keyword-2>"

status: proposed
created_at: null
timezone: "GMT+3"

originality:
  declaration: true
  search_date: "YYYY-MM-DD"
  sources:
    - "Google Scholar"
    - "Semantic Scholar"
    - "arXiv"
  queries:
    - "<exact search query>"
  closest_public_work:
    - title: "<closest work title or NONE FOUND>"
      url_or_identifier: "<DOI/arXiv/URL or NONE>"
  differentiation: "<Why the core idea differs from the closest known public work>"

ai:
  assisted: true
  human_contribution: "Original key idea and core research prompt"
  roles:
    - literature_search
    - coding
    - data_processing
    - experiments
    - analysis
    - figures
    - manuscript_drafting
    - repository_preparation
  tools:
    - "<AI tool/model if known>"

licenses:
  code: Apache-2.0
  content: CC-BY-4.0
  data: "<dataset-specific license or N/A>"
