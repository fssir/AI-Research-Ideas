<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<style>
text { font-family: Arial, Helvetica, sans-serif; fill:#1D2733; }
.title { font-size:24px; font-weight:700; fill:#16324F; }
.subtitle { font-size:13px; fill:#637282; }
.label { font-size:12px; }
.small { font-size:11px; fill:#637282; }
.value { font-size:11px; font-weight:700; }
.boxTitle { font-size:13px; font-weight:700; fill:#16324F; }
</style>
<rect width="100%" height="100%" fill="#F7FAFC"/>
<text x="600.0" y="40" text-anchor="middle" class="title">Experimental Design for Cross-Constant Transfer</text>
<text x="600" y="65" text-anchor="middle" class="subtitle">Low-compute next-digit prediction across seen and completely unseen irrational constants</text>
<rect x="40" y="125" width="190" height="150" rx="16" fill="white" stroke="#2A7F9E" stroke-width="2"/>
<text x="135.0" y="159" text-anchor="middle" class="boxTitle">1. Training Sources</text>
<text x="135.0" y="197" text-anchor="middle" class="label">pi, e, sqrt(2), sqrt(3)</text>
<text x="135.0" y="221" text-anchor="middle" class="label">24,000 training digits each</text>
<line x1="238" y1="200.0" x2="260" y2="200.0" stroke="#E79A3B" stroke-width="3"/>
<polygon points="260,194.0 260,206.0 270,200.0" fill="#E79A3B"/>
<rect x="270" y="125" width="190" height="150" rx="16" fill="white" stroke="#2A7F9E" stroke-width="2"/>
<text x="365.0" y="159" text-anchor="middle" class="boxTitle">2. Windowing</text>
<text x="365.0" y="197" text-anchor="middle" class="label">Context length = 32</text>
<text x="365.0" y="221" text-anchor="middle" class="label">Chronological, no boundary crossing</text>
<line x1="468" y1="200.0" x2="490" y2="200.0" stroke="#E79A3B" stroke-width="3"/>
<polygon points="490,194.0 490,206.0 500,200.0" fill="#E79A3B"/>
<rect x="500" y="125" width="190" height="150" rx="16" fill="white" stroke="#2A7F9E" stroke-width="2"/>
<text x="595.0" y="159" text-anchor="middle" class="boxTitle">3. Shared TinyTCN</text>
<text x="595.0" y="197" text-anchor="middle" class="label">3,442 parameters</text>
<text x="595.0" y="221" text-anchor="middle" class="label">Causal dilated convolutions</text>
<line x1="698" y1="200.0" x2="720" y2="200.0" stroke="#E79A3B" stroke-width="3"/>
<polygon points="720,194.0 720,206.0 730,200.0" fill="#E79A3B"/>
<rect x="730" y="125" width="190" height="150" rx="16" fill="white" stroke="#2A7F9E" stroke-width="2"/>
<text x="825.0" y="159" text-anchor="middle" class="boxTitle">4. Seen-Future Test</text>
<text x="825.0" y="197" text-anchor="middle" class="label">Same four constants</text>
<text x="825.0" y="221" text-anchor="middle" class="label">Future positions 34k-44k</text>
<line x1="928" y1="200.0" x2="950" y2="200.0" stroke="#E79A3B" stroke-width="3"/>
<polygon points="950,194.0 950,206.0 960,200.0" fill="#E79A3B"/>
<rect x="960" y="125" width="200" height="150" rx="16" fill="white" stroke="#2A7F9E" stroke-width="2"/>
<text x="1060.0" y="159" text-anchor="middle" class="boxTitle">5. Zero-Shot Transfer</text>
<text x="1060.0" y="197" text-anchor="middle" class="label">sqrt(5), cbrt(2), phi</text>
<text x="1060.0" y="221" text-anchor="middle" class="label">ln(2), ln(3), zeta(3)</text>
<rect x="145" y="345" width="250" height="100" rx="14" fill="#EEF6F8" stroke="#6BB7C9" stroke-width="1.5"/>
<text x="270.0" y="379" text-anchor="middle" class="boxTitle">Baselines</text>
<text x="270.0" y="410" text-anchor="middle" class="label">Validation-selected n-gram; IID digits</text>
<rect x="475" y="345" width="250" height="100" rx="14" fill="#EEF6F8" stroke="#6BB7C9" stroke-width="1.5"/>
<text x="600.0" y="379" text-anchor="middle" class="boxTitle">Metrics</text>
<text x="600.0" y="410" text-anchor="middle" class="label">Accuracy; cross entropy; perplexity</text>
<rect x="805" y="345" width="250" height="100" rx="14" fill="#EEF6F8" stroke="#6BB7C9" stroke-width="1.5"/>
<text x="930.0" y="379" text-anchor="middle" class="boxTitle">Diagnostic Control</text>
<text x="930.0" y="410" text-anchor="middle" class="label">Champernowne structured nonperiodic decimal</text>
<text x="600" y="515" text-anchor="middle" class="subtitle">Primary question: does jointly learned digit-level structure transfer to an irrational constant that contributed no training data?</text>
</svg>
